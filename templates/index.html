<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Modal Travel Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🌍 Travel Planner</h1>
                <p>AI-Powered Travel Itineraries with Real-Time Information</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-card">
                    <h2>Plan Your Journey</h2>
                    <form id="travelForm" enctype="multipart/form-data">
                        <!-- Image Upload -->
                        <div class="form-group">
                            <label for="imageInput" class="form-label">
                                <span class="label-text">📸 Upload Destination Image</span>
                                <p class="label-hint">Upload a photo of a landmark, location, or destination</p>
                            </label>
                            <div class="image-upload-area" id="dropZone">
                                <input 
                                    type="file" 
                                    id="imageInput" 
                                    name="image" 
                                    accept=".png,.jpg,.jpeg,.gif,.webp"
                                    hidden
                                >
                                <div class="upload-content">
                                    <div class="upload-icon">📤</div>
                                    <p class="upload-text">Drag and drop your image here</p>
                                    <p class="upload-or">or</p>
                                    <button type="button" class="upload-button" id="uploadButton">
                                        Choose File
                                    </button>
                                </div>
                                <div id="imagePreview" class="image-preview" style="display: none;">
                                    <img id="previewImg" alt="Preview">
                                    <button type="button" class="remove-image" id="removeImage">✕</button>
                                </div>
                            </div>
                            <div id="imageFileName" class="file-name" style="display: none;"></div>
                        </div>

                        <!-- Preferences Input -->
                        <div class="form-group">
                            <label for="preferencesInput" class="form-label">
                                <span class="label-text">✍️ Travel Preferences</span>
                                <p class="label-hint">Tell us about your trip duration, budget, interests, and any constraints</p>
                            </label>
                            <textarea 
                                id="preferencesInput" 
                                name="preferences" 
                                placeholder="Example: I'm traveling for 3 days with a budget of $800. I prefer outdoor activities and local dining. Please find current operating hours and ticket prices."
                                rows="6"
                                required
                            ></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="submit-button" id="submitButton">
                            ✨ Generate Itinerary
                        </button>
                    </form>
                </div>
            </section>

            <!-- Loading State -->
            <div id="loadingState" class="loading-state" style="display: none;">
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p class="loading-text">Creating your personalized travel itinerary...</p>
                    <div class="progress-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <!-- Output Section -->
            <section id="outputSection" class="output-section" style="display: none;">
                <div id="itineraryContent"></div>
            </section>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by Google Gemini API with Real-Time Search Grounding</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
